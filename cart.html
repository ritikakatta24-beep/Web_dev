<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cart - Aesthetic Steps</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Lobster&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      background-color: #f9f9f9;
    }

    header {
      background-color: #f5f5f5;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-family: 'Lobster', cursive;
      margin: 0;
      font-size: 40px;
    }

    header p {
      margin: 0;
      font-size: 14px;
      color: #555;
    }

    nav {
      display: flex;
      gap: 30px;
    }

    nav a {
      text-decoration: none;
      color: black;
      font-weight: bold;
    }

    nav a:hover {
      color: gray;
    }

    /* Cart Section */
    .cart-container {
      max-width: 900px;
      margin: 50px auto;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .cart-container h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #A9A9A9;
      color: white;
    }

    img {
      width: 80px;
      height: 60px;
      object-fit: cover;
    }

    .total {
      text-align: right;
      margin-top: 30px;
      font-size: 20px;
      font-weight: bold;
    }

    .checkout-btn {
      display: block;
      margin: 30px auto 0;
      background-color: black;
      color: white;
      padding: 12px 25px;
      text-decoration: none;
      border-radius: 5px;
      text-align: center;
      width: 200px;
    }

    .checkout-btn:hover {
      background-color: gray;
    }

    footer {
      background-color: black;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 50px;
    }

  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <div>
      <h1>Aesthetic Steps</h1>
      <p>Lead the way. Leave a mark.</p>
    </div>

    <nav>
      <a href="index.html">HOME</a>
      <a href="#women">WOMEN</a>
      <a href="#men">MEN</a>
      <a href="#brands">BRANDS</a>
      <a href="cart.html">MY CART</a>
    </nav>

    <div>
      <a href="#search">🔍</a>
      <a href="cart.html">🛍️</a>
    </div>
  </header>

  <!-- Cart Section -->
  <section class="cart-container">
    <h2>My Shopping Cart</h2>

    <table>
      <tr>
        <th>Product</th>
        <th>Model</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Total</th>
      </tr>

      <tr>
        <td><img src="https://thecraze.in/cdn/shop/files/c38d9ad4b17c5bf70ef83c2520e30319.jpg?v=1753101080" alt="Black Shoe"></td>
        <td>FH-Gasping 2</td>
        <td>Rs.6000</td>
        <td>1</td>
        <td>Rs.6000</td>
      </tr>

      <tr>
        <td><img src="https://encrypted-tbn2.gstatic.com/shopping?q=tbn:ANd9GcSjiexpseZkdq389pDngSWO6cmApreVrx04WrlBPEikrvYdezZl5tbEV4wpILJJhRPO_w9RBN_cu-7vJ2VAhY3oKLjYNDceYVIAECClbDgsIzRtjwWrof2MqQ" alt="Yellow Shoe"></td>
        <td>Relaxo 2.0</td>
        <td>Rs.5000</td>
        <td>1</td>
        <td>Rs.5000</td>
      </tr>
    </table>

    <p class="total">Total Amount: Rs.11,000</p>

    <a href="#checkout" class="checkout-btn">Proceed to Checkout</a>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Aesthetic Steps. All rights reserved.</p>
  </footer>

</body>
</html>
